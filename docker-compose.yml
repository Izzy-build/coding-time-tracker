# Local development database only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ctt
      POSTGRES_PASSWORD: ctt_dev_pw
      POSTGRES_DB: ctt
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ctt -d ctt']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
